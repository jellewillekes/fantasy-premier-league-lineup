name: fetch-data
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: |
          python - << 'PY'
          from src.fpl_data.understat import fetch_understat_players
          import os
          df = fetch_understat_players(2025)
          os.makedirs("data/processed", exist_ok=True)
          df.to_csv("data/processed/understat_players_2025_26.csv", index=False)
          print("Saved data/processed/understat_players_2025_26.csv")
          PY
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update data" || echo "No changes"
          git push
